name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: oven-sh/setup-bun@v2
      - name: Load the server entry the way OpenCode does
        run: bun -e 'const m = await import("./server.js"); if (typeof m.default?.setup !== "function") process.exit(1)'
      - name: Check package contents
        run: npm pack --dry-run 2>&1 | grep -q "src/index.ts"
